<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Happy Anniversary Rubaiya ❤️</title>  <style>  
    *{  
        margin:0;  
        padding:0;  
        box-sizing:border-box;  
    }  
  
    body{  
        height:100vh;  
        overflow:hidden;  
        display:flex;  
        justify-content:center;  
        align-items:center;  
        flex-direction:column;  
        font-family:Arial, sans-serif;  
        background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffdde1);  
    }  
  
    .heart-box{  
        position:relative;  
        width:180px;  
        height:180px;  
        cursor:pointer;  
        touch-action:none;  
    }  
  
    .heart{  
        position:absolute;  
        width:110px;  
        height:110px;  
        background:#ff2e63;  
        transform:rotate(-45deg);  
        border-radius:20px 0 20px 0;  
        left:35px;  
        top:35px;  
  
        box-shadow:  
            0 15px 30px rgba(255,46,99,0.4),  
            inset 8px 8px 15px rgba(255,255,255,0.35),  
            inset -8px -8px 15px rgba(120,0,30,0.2);  
  
        transition:transform 1s ease,  
                   left 1s ease,  
                   top 1s ease;  
        animation:jelly 2s infinite;  
    }  
  
    .heart:before,  
    .heart:after{  
        content:"";  
        position:absolute;  
        width:110px;  
        height:110px;  
        background:#ff2e63;  
        border-radius:50%;  
  
        box-shadow:  
            inset 8px 8px 15px rgba(255,255,255,0.3),  
            inset -8px -8px 15px rgba(120,0,30,0.15);  
    }  
  
    .heart:before{  
        top:-55px;  
        left:0;  
    }  
  
    .heart:after{  
        left:55px;  
        top:0;  
    }  
  
    @keyframes jelly{  
        0%,100%{  
            transform:rotate(-45deg) scale(1,1);  
        }  
        25%{  
            transform:rotate(-45deg) scale(1.08,0.92);  
        }  
        50%{  
            transform:rotate(-45deg) scale(0.95,1.05);  
        }  
        75%{  
            transform:rotate(-45deg) scale(1.04,0.96);  
        }  
    }  
  
    /* টাচ করলে হার্ট সরে যাবে */  
    .heart-box:active .heart{  
        left:75px;  
        top:15px;  
        transform:rotate(-25deg) scale(0.9);  
        animation:none;  
        transition:all 1s ease;  
    }  
  
    h1{  
        margin-top:35px;  
        color:white;  
        text-align:center;  
        font-size:28px;  
        text-shadow:0 3px 10px rgba(0,0,0,0.2);  
    }  
  
    .name{  
        margin-top:10px;  
        font-size:24px;  
        font-weight:bold;  
        color:#ff2e63;  
        background:white;  
        padding:10px 25px;  
        border-radius:30px;  
        box-shadow:0 8px 20px rgba(0,0,0,0.15);  
    }  
  
    p{  
        margin-top:15px;  
        color:white;  
        font-size:17px;  
        text-align:center;  
        padding:0 20px;  
    }  
  
    .floating{  
        position:absolute;  
        bottom:-30px;  
        font-size:25px;  
        animation:float 7s linear infinite;  
        opacity:0.8;  
    }  
  
    @keyframes float{  
        0%{  
            transform:translateY(0) rotate(0deg);  
            opacity:0;  
        }  
        20%{  
            opacity:1;  
        }  
        100%{  
            transform:translateY(-110vh) rotate(360deg);  
            opacity:0;  
        }  
    }  
  
    .f1{left:10%;animation-delay:0s;}  
    .f2{left:25%;animation-delay:2s;}  
    .f3{left:50%;animation-delay:4s;}  
    .f4{left:70%;animation-delay:1s;}  
    .f5{left:90%;animation-delay:3s;}  
</style>  </head>  <body>  <div class="floating f1">❤️</div>  
<div class="floating f2">💖</div>  
<div class="floating f3">💕</div>  
<div class="floating f4">❤️</div>  
<div class="floating f5">💗</div>  <div class="heart-box">  
    <div class="heart"></div>  
</div>  <h1>Happy 7 Months Anniversary ❤️</h1>  <div class="name">  
    My Lovely Wife, Rubaya 💍❤️  
</div>  <p>  
    I Love You So Much ❤️<br>  
    Thank You For Being My Wife 💕<br>  
    Forever & Always, You And Me 🥰💍  
</p>  </body>  
</html>
